id: silent_exfiltration
name: "Silent Exfiltration"
business_context: >
  Finance has flagged unusual outbound data activity, and a customer complaint
  suggests employee personal data may have been exposed. Investigate how an
  attacker without admin credentials could have accessed and exported the full
  employee directory.
difficulty: Intermediate

stages:
  - id: 1
    business_module: "Auth"
    target_endpoint: "POST /api/v1/auth/login"
    flaw_mode: "brute_force"
    vulnerability_category: "authentication"
    objective: "Compromise the helpdesk account by exploiting the lack of login rate-limiting."
    credentials_to_use: "Username: jess.okafor@neofactory.com | Password: Nf@2024! (Must fail login 5 times first to simulate a brute force)"
    discovery_process: >
      A maintenance ticket from three weeks ago contains an IT comment about a
      recent account migration. Read between the lines of how IT teams typically
      handle temporary credentials after directory migrations.
    capability_gained: >
      Recognizes authentication flows without rate-limiting as enabling credential
      compromise against weak or predictable passwords — even without a lockout bypass.
    evidence: ["helpdesk_login_session"]
    owasp: "A07:2021 - Identification and Authentication Failures"
    mitre: "T1110 - Brute Force"
    cvss:
      attack_vector: Network
      attack_complexity: Low
      privileges_required: None
      user_interaction: None
      scope: Unchanged
      confidentiality: High
      integrity: Low
      availability: None
    owasp_risk_factors: {likelihood: 7, impact: 7}
    enterprise_layer: "Authentication Gateway"
    attack_surface: "Login Form / POST /api/v1/auth/login"
    technical_mechanism: "No Rate-Limiting on Login Endpoint — Credential Stuffing / Pattern Brute-Force"
    discovery_surface: "Login Page & Maintenance Ticket Comments (IT Migration Thread)"
    next_stage: 2

  - id: 2
    business_module: "Search"
    target_endpoint: "POST /api/v1/search"
    flaw_mode: "injection"
    vulnerability_category: "injection"
    objective: "Use the global search to retrieve data outside the intended search scope."
    credentials_to_use: "Search Query: \" OR 1=1 --"
    discovery_process: >
      Now authenticated as the helpdesk account, probe the search bar
      with unusual inputs to see if the backend query is safely parameterized.
    capability_gained: >
      Can identify and exploit unsanitized query inputs to retrieve data outside
      the intended scope of a feature — including configuration references
      not meant to be surfaced in search results.
    evidence: ["backup_filename_reference"]
    owasp: "A03:2021 - Injection"
    mitre: "T1190 - Exploit Public-Facing Application"
    cvss:
      attack_vector: Network
      attack_complexity: Low
      privileges_required: Low
      user_interaction: None
      scope: Unchanged
      confidentiality: High
      integrity: Low
      availability: None
    owasp_risk_factors: {likelihood: 8, impact: 8}
    enterprise_layer: "Global Search"
    attack_surface: "Enterprise Search Input Bar"
    technical_mechanism: "Unsanitized Database Query Returning Out-of-Scope Device Backup References"
    discovery_surface: "Global Search Bar (Ctrl+K)"
    next_stage: 3

  - id: 3
    business_module: "Assets"
    target_endpoint: "GET /api/v1/devices/{id}/backup"
    flaw_mode: "path_traversal"
    vulnerability_category: "broken_access_control"
    objective: "Read the internal service credentials file via path traversal on the backup download."
    credentials_to_use: "Filename Input: ../../internal_secrets/svc_credentials.txt"
    discovery_process: >
      The search results contain a backup filename reference for a device.
      The device detail page now has a 'Download Config Backup' action.
      Modify the filename parameter to navigate outside the intended backup directory.
    capability_gained: >
      Can exploit unsanitized file-path parameters to read files outside an intended
      directory. Also identifies a secondary vulnerability: insecure on-disk storage
      of internal service credentials (CWE-522).
    evidence: ["svc_credentials_file"]
    owasp: "A01:2021 - Broken Access Control (Path Traversal)"
    mitre: "T1552.001 - Credentials In Files"
    cvss:
      attack_vector: Network
      attack_complexity: Low
      privileges_required: Low
      user_interaction: None
      scope: Unchanged
      confidentiality: High
      integrity: None
      availability: None
    owasp_risk_factors: {likelihood: 6, impact: 9}
    enterprise_layer: "Device Management / File System"
    attack_surface: "Device Config Backup Download"
    technical_mechanism: "Unsanitized Filename Parameter Enabling Directory Traversal to Credential Store"
    discovery_surface: "Device Detail Page / Download Config Backup Feature"
    next_stage: 4

  - id: 4
    business_module: "Employees"
    target_endpoint: "GET /api/v1/employees/export"
    flaw_mode: "stolen_key_bypass"
    vulnerability_category: "broken_access_control"
    objective: "Use the stolen internal service key to bypass admin authorization and export the full employee directory."
    credentials_to_use: "HTTP Header -> X-Service-Key: nf-internal-svc-x9k2p"
    discovery_process: >
      The credentials file from Stage 3 contains an internal API key.
      The employee export endpoint has a secondary authorization path that accepts
      this key as an X-Service-Key header — the payoff of the theft chain.
    capability_gained: >
      Can leverage exfiltrated internal service credentials to bypass an intended
      authorization boundary and access privileged data — confirming the 'unusual
      outbound activity' Finance flagged was this exact export.
    evidence: ["employee_export_payload"]
    owasp: "A01:2021 - Broken Access Control (Authorization Bypass)"
    mitre: "T1078 - Valid Accounts"
    cvss:
      attack_vector: Network
      attack_complexity: Low
      privileges_required: Low
      user_interaction: None
      scope: Changed
      confidentiality: High
      integrity: High
      availability: None
    owasp_risk_factors: {likelihood: 9, impact: 9}
    enterprise_layer: "Employee Data / HR Export"
    attack_surface: "Employee Export Endpoint"
    technical_mechanism: "Authorization Check Accepts Stolen Internal Service Key as Valid Admin Credential Bypass"
    discovery_surface: "Credentials File from Stage 3 / API Header Exploration"
    next_stage: null
