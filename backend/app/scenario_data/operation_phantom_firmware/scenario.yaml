        L_Motive: "9"
        L_Opp: "4"
        L_Size: "2"
        L_Disc: "3"
        L_Exp: "5"
        L_Aware: "6"
        L_Detect: "8"
      owasp_impact:
        I_Conf: "9"
        I_Integ: "9"
        I_Avail: "9"
        I_Acct: "9"
        I_Fin: "9"
        I_Rep: "9"
