id: operation_phantom_firmware
name: "Operation Phantom Firmware"
business_context: >
  A maintenance ticket reports that Production Line 2 stopped after a
  firmware update. Investigate why and produce a professional pentest assessment deliverable.
difficulty: Intermediate
stages:
  - id: 1
    business_module: "Assets"
    target_endpoint: "GET /api/v1/devices/{id}"
    flaw_mode: "none"
    vulnerability_category: "informational"
    objective: "Discover the failed deployment ticket's root cause."
    discovery_process: "Read the device record for Line 2 in Assets."
    capability_gained: "Recognizes outdated/unpatched components in an asset inventory."
    evidence: ["device_record_line2"]
    owasp: "A06:2021 - Vulnerable and Outdated Components"
    mitre: "T1190 - Exploit Public-Facing Application"
    cvss: {attack_vector: Network, attack_complexity: Low, privileges_required: None,
           user_interaction: None, scope: Unchanged, confidentiality: High,
           integrity: Low, availability: None}
    owasp_risk_factors: {likelihood: 6, impact: 6}
    enterprise_layer: "Asset Inventory"
    attack_surface: "Device Inventory / PLC Controller"
    technical_mechanism: "Unpatched OT-RTOS Firmware v1.2.3 & Deferred Maintenance"
    discovery_surface: "Device Inventory Page"
    next_stage: 2

  - id: 2
    business_module: "Employees"
    target_endpoint: "GET /api/v1/employees/{id}"
    flaw_mode: "option_a"
    vulnerability_category: "authorization"
    objective: "Access the assigned engineer's employee record."
    discovery_process: "Follow the assigned_engineer name from the device record."
    capability_gained: "Can access records outside assigned clearance level."
    evidence: ["employee_record_leak"]
    owasp: "A01:2021 - Broken Access Control"
    mitre: "T1078 - Valid Accounts"
    cvss: {attack_vector: Network, attack_complexity: Low, privileges_required: Low,
           user_interaction: None, scope: Unchanged, confidentiality: High,
           integrity: None, availability: None}
    owasp_risk_factors: {likelihood: 7, impact: 5}
    enterprise_layer: "Employee Management"
    attack_surface: "Employee Profile Viewer"
    technical_mechanism: "Missing Ownership Validation & IDOR Parameter Flaw"
    discovery_surface: "URL Parameters & Employee Directory"
    next_stage: 3

  - id: 3
    business_module: "Search"
    target_endpoint: "POST /api/v1/search"
    flaw_mode: "option_a"
    vulnerability_category: "injection"
    objective: "Use the global search to find deployment logs."
    discovery_process: "Try an unusual query in the search bar."
    capability_gained: "Can exploit unsanitized input handling to retrieve unintended data."
    evidence: ["deploy_log_leak"]
    owasp: "A03:2021 - Injection"
    mitre: "T1190 - Exploit Public-Facing Application"
    cvss: {attack_vector: Network, attack_complexity: Low, privileges_required: None,
           user_interaction: None, scope: Unchanged, confidentiality: High,
           integrity: Low, availability: None}
    owasp_risk_factors: {likelihood: 8, impact: 7}
    enterprise_layer: "Global Search"
    attack_surface: "Enterprise Search Input Bar"
    technical_mechanism: "Unsanitized Database Query & Deployment Log Leakage"
    discovery_surface: "Global Search Bar"
    next_stage: 4

  - id: 4
    business_module: "Auth"
    target_endpoint: "POST /api/v1/devices/{id}/firmware-push"
    flaw_mode: "option_b"
    vulnerability_category: "authentication"
    objective: "Escalate session privileges and confirm who really pushed the firmware update."
    discovery_process: "Inspect what the session/token stores client-side."
    capability_gained: "Recognizes when a system trusts client-supplied session data instead of re-verifying server-side."
    evidence: ["session_escalation_proof"]
    owasp: "A07:2021 - Identification and Authentication Failures"
    mitre: "T1548 - Abuse Elevation Control Mechanism"
    cvss: {attack_vector: Network, attack_complexity: Low, privileges_required: Low,
           user_interaction: None, scope: Changed, confidentiality: High,
           integrity: High, availability: High}
    owasp_risk_factors: {likelihood: 9, impact: 9}
    enterprise_layer: "Authentication & Device Operations"
    attack_surface: "Firmware Deployment Endpoint"
    technical_mechanism: "Server Trusting Client-Supplied Session Header (X-User-Role)"
    discovery_surface: "Browser DevTools / Client Session"
    next_stage: null
