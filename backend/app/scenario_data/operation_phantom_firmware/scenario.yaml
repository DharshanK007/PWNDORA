      - "T1213 - Data from Information Repositories"
      - "T1005 - Data from Local System"
    cvss: {attack_vector: Network, attack_complexity: Low, privileges_required: None,
           user_interaction: None, scope: Unchanged, confidentiality: High,
           integrity: Low, availability: None}
    owasp_risk_factors: {likelihood: 8, impact: 7}
    enterprise_layer: "Global Search"
    attack_surface: "Enterprise Search Input Bar"
    technical_mechanism: "Unsanitized Database Query & Deployment Log Leakage"
    discovery_surface: "Global Search Bar"
    evaluation_ground_truth:
      mitre:
        question: "Which MITRE ATT&CK technique best captures the vulnerability exploited via the search bar?"
        options:
          - "T1190 - Exploit Public-Facing Application"
          - "T1518 - Software Discovery"
          - "T1087 - Account Discovery"
          - "T1548 - Abuse Elevation Control Mechanism"
        answer: "T1190 - Exploit Public-Facing Application"
      cvss:
        AV: "Network"
        PR: "Unauthenticated"
        C: "High"
        I: "Low"
        A: "None"
      owasp_likelihood:
        L_Skill: "5"
        L_Motive: "9"
        L_Opp: "9"
        L_Size: "9"
        L_Disc: "3"
        L_Exp: "3"
        L_Aware: "5"
        L_Detect: "1"
      owasp_impact:
        I_Conf: "9"
        I_Integ: "5"
        I_Avail: "1"
        I_Acct: "7"
        I_Fin: "7"
        I_Rep: "5"
        I_Comp: "5"
        I_Priv: "3"
    next_stage: 4

  - id: 4
    business_module: "Auth"
    target_endpoint: "POST /api/v1/devices/{id}/firmware-push"
    flaw_mode: "option_b"
    vulnerability_category: "authentication"
    objective: "Escalate session privileges and confirm who really pushed the firmware update."
    credentials_to_use: "HTTP Header -> X-User-Role: Administrator"
    discovery_process: "Inspect what the session/token stores client-side."
    capability_gained: "Recognizes when a system trusts client-supplied session data instead of re-verifying server-side."
    evidence: ["session_escalation_proof"]
    owasp: "A07:2021 - Identification and Authentication Failures"
    mitre: "T1548 - Abuse Elevation Control Mechanism"
    mitre_techniques:
      - "T1548 - Abuse Elevation Control Mechanism"
      - "T1068 - Exploitation for Privilege Escalation"
      - "T1078 - Valid Accounts"
    cvss: {attack_vector: Network, attack_complexity: Low, privileges_required: Low,
           user_interaction: None, scope: Changed, confidentiality: High,
           integrity: High, availability: High}
    owasp_risk_factors: {likelihood: 9, impact: 9}
    enterprise_layer: "Authentication & Device Operations"
    attack_surface: "Firmware Deployment Endpoint"
    technical_mechanism: "Server Trusting Client-Supplied Session Header (X-User-Role)"
    discovery_surface: "Browser DevTools / Client Session"
    evaluation_ground_truth:
      mitre:
        question: "Which MITRE ATT&CK technique best describes bypassing authorization by modifying the X-User-Role header?"
        options:
          - "T1548 - Abuse Elevation Control Mechanism"
          - "T1190 - Exploit Public-Facing Application"
          - "T1087 - Account Discovery"
          - "T1518 - Software Discovery"
        answer: "T1548 - Abuse Elevation Control Mechanism"
      cvss:
        AV: "Network"
        PR: "Normal User"
